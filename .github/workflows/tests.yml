name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests stub out transformers and google_play_scraper, so the ~2 GB torch install from
      # requirements.txt is not needed.
      - run: pip install fastapi httpx pytest
      - run: python -m pytest -q
